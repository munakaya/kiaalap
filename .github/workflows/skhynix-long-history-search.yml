name: Temporary SK hynix long-history search

on:
  push:
    branches:
      - automation/skhynix-long-history-search-20260831
    paths:
      - 'research/skhynix-long-history/**'
      - '.github/workflows/skhynix-long-history-search.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy numba
      - name: Run old-history-only search
        run: |
          mkdir -p /tmp/skhynix-long-history
          python research/skhynix-long-history/long_history_grid_search.py \
            --output /tmp/skhynix-long-history/old-history-search.json \
            --top-csv /tmp/skhynix-long-history/old-history-top100.csv \
            --threads 4
      - name: Print selected candidate
        run: |
          python - <<'PY'
          import json
          p='/tmp/skhynix-long-history/old-history-search.json'
          x=json.load(open(p))
          print(json.dumps({k:x[k] for k in ('grid_candidates','all_blocks_positive_min3_count','stress_survivors','selected')}, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: skhynix-long-history-results
          path: /tmp/skhynix-long-history/
          if-no-files-found: error
          retention-days: 3
